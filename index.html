<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="LED Tiyatro">
<meta name="description" content="WLED / ESP32 tabanlı tiyatro LED şerit ışık kontrol masası — çevrimdışı çalışır.">
<title>LED Tiyatro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Cpath d='M12 20h40v6H12zM12 38h40v6H12z' fill='%23222'/%3E%3Cg fill='%23ffb347'%3E%3Ccircle cx='18' cy='23' r='3'/%3E%3Ccircle cx='32' cy='23' r='3'/%3E%3Ccircle cx='46' cy='23' r='3'/%3E%3C/g%3E%3Cg fill='%23ff3b3b'%3E%3Ccircle cx='18' cy='41' r='3'/%3E%3Ccircle cx='32' cy='41' r='3'/%3E%3Ccircle cx='46' cy='41' r='3'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --bg:#000;--p1:#09090b;--p2:#111114;--p3:#18181d;--p4:#222229;
  --ln:#232329;--ln2:#33333c;--tx:#ebe8e3;--mu:#9b99a4;--dm:#65636e;
  --acc:#ffb347;--acc2:#ff8c1a;--red:#ff3b3b;--grn:#2ed27b;--blu:#5aa8ff;--yel:#ffd34d;
  --r:14px;--dockH:84px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#000}
body{color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.i{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}
.i.sm{width:16px;height:16px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;padding:0}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--tx);background:var(--p1);border:1px solid var(--ln2);border-radius:10px;padding:8px 11px;min-height:42px;width:100%}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=color]{padding:3px;width:48px;min-width:48px;height:42px;cursor:pointer;background:var(--p1)}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:7px}
input[type=color]::-moz-color-swatch{border:0;border-radius:7px}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;border:0;padding:0;min-height:34px;height:34px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--p4);border-radius:6px}
input[type=range]::-moz-range-track{height:6px;background:var(--p4);border-radius:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:var(--acc);border:3px solid #000;box-shadow:0 0 0 1px var(--acc)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--acc);border:3px solid #000}
input[type=number]{-moz-appearance:textfield}
label{display:block}
.lbl,label>span{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);margin:0 0 5px}
h2{font-size:17px;margin:0;font-weight:650;letter-spacing:.01em}
h3{font-size:14px;margin:0 0 10px;color:var(--mu);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
small{color:var(--mu)}
a{color:var(--acc)}
code{background:var(--p3);padding:1px 6px;border-radius:6px;font-size:.92em}
.grow{flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--mu)}
.hidden{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:8px 14px;border-radius:11px;background:var(--p3);border:1px solid var(--ln2);font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--p4)}
.btn.pri{background:var(--acc);color:#140b00;border-color:var(--acc)}
.btn.pri:hover{background:#ffc26a}
.btn.danger{color:var(--red);border-color:#5a1f1f}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px;border-radius:9px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:11px;color:var(--mu);border:1px solid transparent}
.ibtn:hover{background:var(--p3);color:var(--tx)}
.ibtn.on{color:var(--acc);border-color:#5a3c14;background:#1d1407}
.seg{display:inline-flex;background:var(--p2);border:1px solid var(--ln2);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mu);display:inline-flex;align-items:center;gap:6px;min-height:34px}
.seg button.on{background:var(--p4);color:var(--tx)}
.seg button.on.accent{background:var(--acc);color:#140b00}

/* switch */
.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;min-height:34px}
.sw input{position:absolute;opacity:0;width:0;height:0;min-height:0}
.sw i{width:44px;height:26px;border-radius:20px;background:var(--p4);position:relative;flex:none;transition:background .15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#777;transition:transform .15s,background .15s}
.sw input:checked+i{background:#5a3c14}
.sw input:checked+i::after{transform:translateX(18px);background:var(--acc)}
.sw span{font-size:14px;text-transform:none;letter-spacing:0;color:var(--tx);margin:0}

/* layout */
#app{min-height:100vh;padding-bottom:calc(var(--dockH) + 16px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:rgba(0,0,0,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;padding:4px 10px 4px 4px;border-radius:12px;min-height:44px}
.brand:hover{background:var(--p2)}
.brand .logo{width:34px;height:34px;flex:none}
.brand .bt{display:flex;flex-direction:column;align-items:flex-start;min-width:0;line-height:1.15}
.brand .bt small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dm)}
.brand .bt b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.conn{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:30px;background:var(--p2);border:1px solid var(--ln2);font-size:13px;font-weight:600;min-height:38px;white-space:nowrap}
.conn .dot{width:10px;height:10px;border-radius:50%;background:var(--dm);flex:none}
.conn small{font-weight:500;color:var(--dm)}
.conn.ok .dot{background:var(--grn);box-shadow:0 0 10px var(--grn)}
.conn.connecting .dot{background:var(--yel);animation:pulse 1s infinite}
.conn.error .dot{background:var(--red)}
.conn.demo .dot{background:var(--blu);box-shadow:0 0 8px var(--blu)}
.conn.error{border-color:#4a1d1d}
@keyframes pulse{50%{opacity:.25}}
.tabs{display:flex;gap:4px;padding:8px 12px 0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--ln);background:#000;position:sticky;top:calc(61px + env(safe-area-inset-top));z-index:30}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:inline-flex;align-items:center;gap:8px;padding:10px 14px 12px;color:var(--mu);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--tx);border-color:var(--acc)}
main{padding:14px 12px;max-width:1500px;margin:0 auto}
.panel{background:var(--p1);border:1px solid var(--ln);border-radius:var(--r);padding:14px}
.panel+.panel{margin-top:14px}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.note{font-size:13px;color:var(--mu);background:var(--p2);border:1px solid var(--ln);border-left:3px solid var(--acc);padding:10px 12px;border-radius:10px}
.note.warn{border-left-color:var(--red)}
.note b{color:var(--tx)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}

/* live view */
.live{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:1000px){.live{grid-template-columns:minmax(0,1fr) 400px}.live .stage{order:2;position:sticky;top:118px;align-self:start;max-height:calc(100vh - 140px - var(--dockH));overflow:auto}}
.stage-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.now-name{font-size:20px;font-weight:700;line-height:1.2}
.now-sub{font-size:13px;color:var(--mu);margin-top:3px}
.now-note{font-size:13px;color:var(--acc);margin-top:4px}
.stage.closed .stage-strips,.stage.closed .stage-extra{display:none}
.ss{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin:6px 0}
.ss-l{font-size:12px;line-height:1.15;overflow:hidden}
.ss-l span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ss-l small{font-size:11px;color:var(--dm)}
canvas.strip{width:100%;height:26px;display:block;border-radius:6px;background:#050505;cursor:pointer}
canvas.strip.big{height:40px}
.ss.ident canvas{outline:2px solid var(--acc)}
.stepdots{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.stepdots b{min-width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;background:var(--p3);color:var(--mu);padding:0 6px}
.stepdots b.on{background:var(--grn);color:#000}
.stepdots b.done{background:#163a26;color:#7ad9a6}
.fol{margin-top:10px;font-size:13px;color:var(--yel)}
.fol .bar{height:4px;background:var(--p4);border-radius:3px;margin-top:5px;overflow:hidden}
.fol .bar i{display:block;height:100%;width:0;background:var(--yel)}
.cues .bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cues .bar h2 small{font-weight:500;margin-left:6px}
.cgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media(max-width:560px){.cgrid{grid-template-columns:1fr}}
.card{position:relative;background:var(--p1);border:1px solid var(--ln);border-radius:var(--r);padding:12px 12px 10px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:border-color .15s,background .15s,transform .08s;min-height:120px;display:flex;flex-direction:column;gap:7px;touch-action:manipulation}
.card:hover{border-color:var(--ln2);background:var(--p2)}
.card:active{transform:scale(.99)}
.card.live{border-color:var(--grn);background:#06140c;box-shadow:0 0 0 1px var(--grn) inset}
.card.next{border-color:#6b5320}
.card.dragging{opacity:.25}
.card.ghost{position:fixed;z-index:200;pointer-events:none;opacity:.92;box-shadow:0 20px 50px rgba(0,0,0,.8);border-color:var(--acc);transform:rotate(1.5deg)}
.c-top{display:flex;align-items:flex-start;gap:9px}
.c-num{min-width:30px;height:30px;border-radius:9px;background:var(--p3);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;padding:0 6px}
.card.live .c-num{background:var(--grn);color:#000}
.card.next .c-num{background:#4a3a14;color:var(--acc)}
.c-name{font-weight:650;font-size:16px;line-height:1.25;flex:1;min-width:0;padding-top:4px;word-break:break-word}
.c-badge{font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 7px;border-radius:6px;display:none;margin-top:5px}
.card.live .c-badge{display:inline-block;background:var(--grn);color:#000}
.card.live .c-badge::after{content:"CANLI"}
.card.next .c-badge{display:inline-block;background:#3a2c0e;color:var(--acc)}
.card.next .c-badge::after{content:"SIRADAKİ"}
.c-drag{width:34px;height:34px;margin:-4px -4px 0 0;color:var(--dm);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.c-drag:hover{background:var(--p3);color:var(--tx)}
.c-note{font-size:13px;color:#e9c37f;display:flex;gap:6px;align-items:flex-start;line-height:1.3;font-style:italic}
.c-note .i{width:15px;height:15px;margin-top:1px;color:var(--acc2)}
.c-sw{display:flex;gap:3px;height:9px}
.c-sw i{flex:1;border-radius:3px;background:#111}
.c-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mu)}
.c-meta>span{display:inline-flex;align-items:center;gap:4px;background:var(--p2);border:1px solid var(--ln);padding:2px 7px;border-radius:7px}
.c-meta .i{width:13px;height:13px}
.c-meta .auto{color:var(--yel)}
.c-meta .steps b{font-weight:700;color:var(--dm);padding:0 2px}
.c-meta .steps b.on{color:var(--grn)}
.c-act{display:flex;gap:4px;margin-top:auto;padding-top:2px}
.c-act button{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mu);padding:6px 9px;border-radius:8px;min-height:32px}
.c-act button:hover{background:var(--p3);color:var(--tx)}
.c-act button.del:hover{color:var(--red)}
.c-prog{position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:0 0 var(--r) var(--r);overflow:hidden}
.c-prog i{display:block;height:100%;width:0;background:var(--yel)}
body.locked .edit-only{display:none!important}
.empty{padding:40px 20px;text-align:center;color:var(--mu);border:1px dashed var(--ln2);border-radius:var(--r)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:90;background:rgba(0,0,0,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--ln2);padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:stretch}
.master{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:var(--p1);border:1px solid var(--ln);border-radius:12px;padding:4px 12px}
.master .lbl{margin:0;white-space:nowrap}
.master b{min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.master.dim b{color:var(--yel)}
.dk{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;font-weight:800;letter-spacing:.06em;min-height:60px;padding:0 16px;border:2px solid transparent;transition:transform .06s}
.dk:active{transform:scale(.97)}
.dk.prev{background:var(--p2);border-color:var(--ln2);color:var(--mu);width:60px;padding:0}
.dk.bo{background:#1a0606;border-color:#7a1414;color:#ff6b6b;min-width:150px}
.dk.bo.on{background:var(--red);color:#000;border-color:var(--red);animation:pulse 1.2s infinite}
.dk.go{background:var(--grn);color:#002611;min-width:230px;flex-direction:column;gap:0;line-height:1.1}
.dk.go span{font-size:18px;display:flex;align-items:center;gap:8px}
.dk.go small{color:#03451f;font-weight:600;font-size:12px;letter-spacing:0;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:760px){
  .dock{flex-wrap:wrap;gap:8px;padding:8px}
  .master{flex:1 1 100%;order:-1;padding:0 12px}
  .dk{min-height:64px}
  .dk.bo{flex:1;min-width:0}
  .dk.go{flex:1.6;min-width:0}
  .dk.go small{max-width:40vw}
  .ss{grid-template-columns:76px 1fr}
  .conn small,.hide-m,.saveind{display:none}
  .netseg span{display:none}.netseg button{padding:6px 9px}
  .top{gap:5px;padding-left:8px;padding-right:8px}.top .ibtn{width:38px}
  .brand .bt b{max-width:34vw}
}

/* modal */
.mbg{position:fixed;left:0;right:0;top:0;bottom:var(--dockH);z-index:80;background:rgba(0,0,0,.72);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px 12px;overflow:auto}
.modal{background:var(--p1);border:1px solid var(--ln2);border-radius:18px;width:100%;max-width:640px;box-shadow:0 30px 80px rgba(0,0,0,.9);display:flex;flex-direction:column;margin-bottom:20px}
.modal.wide{max-width:1100px}
.mh{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 18px;border-bottom:1px solid var(--ln);position:sticky;top:-4vh;background:var(--p1);z-index:3;border-radius:18px 18px 0 0}
.mh h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb{padding:16px 18px}
.mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--ln)}
@media(max-width:760px){.mbg{padding:0}.modal{border-radius:0;min-height:100%;margin:0;border:0}.mh{top:0;border-radius:0}.mb{padding:14px 12px}}

/* toasts */
#toasts{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{background:var(--p3);border:1px solid var(--ln2);border-left:3px solid var(--acc);padding:10px 14px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.7);animation:tin .2s ease-out;pointer-events:auto}
.toast.err{border-left-color:var(--red)}
.toast.ok{border-left-color:var(--grn)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

/* editor */
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.fgrid .full{grid-column:1/-1}
.rg{display:flex;align-items:center;gap:10px}
.rg input[type=range]{flex:1}
.rg output,.rg input[type=number]{width:74px;flex:none;text-align:center;font-variant-numeric:tabular-nums}
.rg output{font-size:14px;color:var(--tx);background:var(--p2);border-radius:8px;padding:6px 4px}
.stabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:16px 0 10px}
.stabs button.st{padding:8px 14px;border-radius:10px;background:var(--p2);border:1px solid var(--ln2);font-weight:600;font-size:14px;min-height:40px}
.stabs button.st.on{background:var(--acc);color:#140b00;border-color:var(--acc)}
.stepbox{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.se{background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-top:10px}
.se.off{opacity:.8}
.se-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.se-h .nm{flex:1;min-width:140px}
.se-h .nm b{display:block;font-size:15px}
.se-h .nm small{font-size:12px}
.se canvas.strip{height:30px;margin-bottom:10px}
.cgrid3{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.cols{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.cols label{flex:none}
.swatches{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.swatches button{width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.12)}
.se-foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--ln)}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;min-height:34px}
.chk input{width:20px;height:20px;min-height:0;accent-color:var(--acc)}

/* strips view */
.strow{display:grid;grid-template-columns:28px minmax(120px,1.6fr) 90px 100px minmax(120px,1fr) 118px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.strow.hd{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;padding-top:0}
.strow .ix{color:var(--dm);font-weight:700;text-align:center}
@media(max-width:860px){
  .strow{grid-template-columns:1fr 1fr;background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:8px}
  .strow.hd{display:none}
  .strow .ix{grid-column:1/-1;text-align:left}

.chips button:hover{color:var(--tx)}

.palrow .nm{min-width:120px;font-weight:600}

.kv dt{color:var(--mu)}
.kv dd{margin:0;word-break:break-all}
.kbd{display:inline-block;min-width:26px;text-align:center;padding:2px 7px;border-radius:6px;background:var(--p3);border:1px solid var(--ln2);border-bottom-width:2px;font-size:12px;font-weight:700}
.showlist .srow{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--ln);border-radius:12px;margin-bottom:8px;background:var(--p2)}

.showlist .srow .nm{flex:1;min-width:0}
.showlist .srow .nm b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

body.redmode #redveil{display:block}
.saveind{font-size:11px;color:var(--dm);display:inline-flex;align-items:center;gap:4px}

.top{height:calc(60px + env(safe-area-inset-top))}
.tabs{top:calc(60px + env(safe-area-inset-top))}

.editbar{display:flex;align-items:center;gap:6px}
.edchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;background:#2a1c05;color:var(--acc);font-size:12px;white-space:nowrap}

#banner.err{background:#2a0606;border:1px solid var(--red);color:#ffd0d0}

.c-note{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;font-size:13px;line-height:1.3;color:#e9c37f;font-style:italic}
.c-meta{min-height:24px}
.c-badge{position:absolute;top:12px;right:12px;margin:0}
.card.live .c-badge,.card.remote .c-badge{display:inline-block}

.card.remote .c-badge::after{content:"DİĞER EKRAN"}

.card.live.pending .c-badge{background:var(--yel)}
.card.live.ackfail .c-badge::after{content:"ONAY YOK"}
.card.live.ackfail .c-badge{background:var(--red);color:#fff}
.card.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.c-act{margin-top:4px;padding-top:6px;border-top:1px solid var(--ln);align-items:center;cursor:default}

.stbl-wrap{overflow-x:auto}

.stbl th{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid var(--ln)}

.stbl .c-ix{width:40px;text-align:center}
.stbl .c-n{width:96px}
.stbl .c-o{width:104px}
.stbl .c-r{width:108px}
.stbl .c-a{width:184px}
.stbl input,.stbl select{min-height:40px}
.stbl .sw{min-height:40px}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:var(--mu)}
.row.nw{flex-wrap:nowrap;gap:2px;justify-content:flex-end}
input:disabled,select:disabled{opacity:.75;cursor:not-allowed}

  .stbl td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}

.chklist{display:flex;flex-direction:column;gap:6px}

.ci-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ci-t small{font-size:12.5px}
.ci-t .man{color:#e9c37f}
.grid2{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.panel .btn{max-width:100%;white-space:normal;text-align:left}
.ci-l{font-size:11px;color:var(--dm);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}

function fxOptions(sel) { return fxNames().map((n, i) => n && n !== 'RSVD' && n !== '-' ? `<option value="${i}" ${i === sel ? 'selected' : ''}>${i} · ${esc(n)}</option>` : '').join(''); }
function palOptions(sel) { return palNames().map((n, i) => `<option value="${i}" ${i === sel ? 'selected' : ''}>${esc(n)}</option>`).join(''); }

let ED = null;
function openCardEditor(cardId, j = 0) {

  ED = { card, j:clamp(j, 0, card.steps.length - 1), m };
  m.el.addEventListener('input', edInput); m.el.addEventListener('change', edInput); m.el.addEventListener('click', edClick);
  edRender();

    switch (b.dataset.sh) {
      case 'open': LOC.showId = id; saveLocal(); render(); m.close(); break;
      case 'new': { if (!needEdit()) break; const n = await promptBox('Yeni oyunun adı', 'Yeni Oyun', 'Oluştur'); if (!n) break; const cur = show(); const ns = { id:uid(), name:n, strips:cur.strips.map(s => Object.assign(clone(s), { id:uid() })), cards:[], created:Date.now() }; S.shows.push(ns); LOC.showId = ns.id; saveLocal(); touch(); render(); m.close(); toast(`“${esc(n)}” oluşturuldu (şeritler kopyalandı).`, 'ok'); break; }
